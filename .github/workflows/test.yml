name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: oven-sh/setup-bun@v2
      - run: npm run compile:bun

      - run: npm run test:stdio

      - name: Smoke test compiled binary
        run: |
          ./pulumi-package-docs --port 3999 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:3999/ > /dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:3999/ > /dev/null
          kill %1
